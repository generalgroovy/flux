<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Outskilled — a fast, skill-driven top-down arena prototype."
    />
    <title>Outskilled — Movement Trial</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="Outskilled movement training arena"></canvas>

      <section id="hud" aria-live="polite">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>OUTSKILLED</span>
        </div>
        <div class="run-info">
          <span id="objective">Reach the first signal</span>
          <span id="timer">00.00</span>
        </div>
        <div id="progress" aria-label="Course progress"></div>
      </section>

      <section id="prompt" class="panel">
        <p class="eyebrow">Movement trial</p>
        <h1>Find your line.</h1>
        <p id="hint">Move with WASD or the arrow keys.</p>
      </section>

      <section id="result" class="panel hidden" aria-hidden="true">
        <p class="eyebrow">Trial clear</p>
        <h2 id="result-time">00.00</h2>
        <p>Clean run. Now make it faster.</p>
        <button id="restart" type="button">Run again <kbd>R</kbd></button>
      </section>

      <p id="controls">WASD / ARROWS <span>MOVE</span> · R <span>RESTART</span></p>
    </main>

    <script type="module" src="./src/game.mjs"></script>
  </body>
</html>
