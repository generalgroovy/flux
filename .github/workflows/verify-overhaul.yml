name: Verify overhaul

on:
  pull_request:
    branches:
      - agent/resource-hud-first-slice
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overhaul-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-checkpoint:
    name: Apply checkpoint payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - id: apply
        name: Apply one-shot patch
        shell: bash
        run: |
          set -euo pipefail
          ready=.agent/overhaul-checkpoint.ready
          if [[ ! -f "$ready" ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t parts < <(find .agent -maxdepth 1 -type f -name 'overhaul-checkpoint.part-*' | sort)
          if [[ ${#parts[@]} -ne 8 ]]; then
            echo "Expected 8 checkpoint parts, found ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/overhaul-checkpoint.patch
          echo "195fc3aba15b1400e679a87e89eae85e1880a64ced98080f540fc142c7fe7239  /tmp/overhaul-checkpoint.patch" | sha256sum --check
          git apply --check /tmp/overhaul-checkpoint.patch
          git apply /tmp/overhaul-checkpoint.patch
          rm -f "$ready" .agent/overhaul-checkpoint.patch.gz.b64 "${parts[@]}"
          git config user.name "FLUX verification agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate playable overhaul checkpoint"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: apply-checkpoint
    if: needs.apply-checkpoint.outputs.applied != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify tests and production modules
        run: node scripts/ci-verify.mjs
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-node${{ matrix.node }}
          path: ci-results/*.log
          if-no-files-found: warn
          retention-days: 7

  package-smoke:
    name: Package configuration smoke
    needs: apply-checkpoint
    if: needs.apply-checkpoint.outputs.applied != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  source-snapshot:
    name: Tested source snapshot
    needs: apply-checkpoint
    if: needs.apply-checkpoint.outputs.applied != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload tested source
        uses: actions/upload-artifact@v4
        with:
          name: flux-tested-source
          path: |
            .agent/**
            .github/**
            assets/**
            desktop/**
            scripts/**
            src/**
            tests/**
            index.html
            styles.css
            package.json
            package-lock.json
            README.md
          if-no-files-found: error
          retention-days: 2
