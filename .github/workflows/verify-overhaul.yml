name: Verify overhaul

on:
  pull_request:
    branches:
      - agent/resource-hud-first-slice
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overhaul-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Parse production modules
        shell: bash
        run: |
          node --check src/content.mjs
          node --check src/match.mjs
          node --check src/game.mjs
          node --check src/lobbies.mjs
          node --check scripts/serve.mjs

  package-smoke:
    name: Package configuration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
