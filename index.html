<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DIFF — a minimal, high-expression 2D top-down arena fighter."
    />
    <title>DIFF — Fundamentals</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="DIFF fundamentals arena"></canvas>

      <header id="hud" aria-live="polite">
        <div class="identity">
          <div class="brand"><i aria-hidden="true"></i><strong>DIFF</strong></div>
          <p><span>KITE</span> / MOBILITY DUELIST</p>
        </div>

        <div class="mission">
          <p id="objective">Break all targets</p>
          <strong id="timer">00.00</strong>
          <div id="progress" aria-label="Training progress"></div>
        </div>

        <div class="location">
          <strong>BREAKLINE</strong>
          <p>FUNDAMENTALS / 01</p>
        </div>
      </header>

      <section id="coach" aria-live="polite">
        <p class="eyebrow">Live brief</p>
        <strong id="hint">WASD — MOVE</strong>
      </section>

      <section id="ability">
        <span>SHIFT</span>
        <div>
          <strong>DASH</strong>
          <i><b id="dash-charge"></b></i>
        </div>
      </section>

      <section id="result" class="panel hidden" aria-hidden="true">
        <p class="eyebrow">Field clear</p>
        <h1 id="result-time">00.00</h1>
        <p>Movement. Aim. Timing. Again.</p>
        <button id="restart" type="button">Run it back <kbd>R</kbd></button>
      </section>

      <p id="controls">
        <b>WASD</b> MOVE <span>·</span> <b>MOUSE</b> AIM <span>·</span>
        <b>CLICK / SPACE</b> FIRE <span>·</span> <b>SHIFT</b> DASH
      </p>
    </main>

    <script type="module" src="./src/game.mjs"></script>
  </body>
</html>
