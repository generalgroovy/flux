name: Verify overhaul

on:
  pull_request:
    branches:
      - agent/resource-hud-first-slice
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overhaul-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify tests and production modules
        run: node scripts/ci-verify.mjs
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-node${{ matrix.node }}
          path: ci-results/*.log
          if-no-files-found: warn
          retention-days: 7

  package-smoke:
    name: Package configuration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  source-snapshot:
    name: Tested source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload tested source
        uses: actions/upload-artifact@v4
        with:
          name: flux-tested-source
          path: |
            .agent/**
            .github/**
            assets/**
            desktop/**
            scripts/**
            src/**
            tests/**
            index.html
            styles.css
            package.json
            package-lock.json
            README.md
          if-no-files-found: error
          retention-days: 2
