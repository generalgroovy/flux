name: Generate visual assets v1

on:
  push:
    branches:
      - agent/visual-assets-production-v1
    paths:
      - .agent/run-visual-assets-v1

permissions:
  contents: write

concurrency:
  group: visual-assets-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Generate and validate assets
        run: |
          python -m py_compile tools/assets/generate_visual_assets_v1.py tools/assets/validate_visual_assets_v1.py
          python tools/assets/generate_visual_assets_v1.py
          python tools/assets/validate_visual_assets_v1.py

      - name: Commit generated repository assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/icons \
            assets/maps/sanctum \
            assets/sprites/champions/nico_lai \
            assets/sprites/skeletons \
            assets/tiles/materials \
            assets/tiles/sanctum \
            content/maps/nexus_to_conservatory_visual_v1.json \
            content/visual
          if git diff --cached --quiet; then
            echo 'Generated visual assets already match the repository.'
            exit 0
          fi
          git commit -m 'feat(assets): generate visual asset foundation v1'
          git push origin HEAD:${{ github.ref_name }}
