name: Cross-platform verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.1
            npm: npm
          - os: ubuntu-latest
            node: 22
            npm: npm
          - os: windows-latest
            node: 20.19.1
            npm: npm.cmd
          - os: windows-latest
            node: 22
            npm: npm.cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: ${{ matrix.npm }} ci --ignore-scripts
      - run: node scripts/ci-verify.mjs
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-node${{ matrix.node }}
          path: ci-results/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Linux launch scripts
        if: runner.os == 'Linux'
        run: bash -n scripts/*.sh
      - name: Validate Windows launch scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/pull-and-run.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) { throw ($errors | Out-String) }

  package:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            npm: npm
            command: npm run package:linux:verified
          - os: windows-latest
            npm: npm.cmd
            command: npm.cmd run package:windows:verified
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: ${{ matrix.npm }} ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: flux-${{ runner.os }}-package
          path: |
            dist/build-manifest.json
            dist/*.AppImage
            dist/*-win-*.exe
          if-no-files-found: error
          retention-days: 7
