name: Generate Wellspring visual assets v2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .agent/run-wellspring-visuals-v2

permissions:
  contents: write

concurrency:
  group: wellspring-visual-assets-v2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out visual-production branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Enable dedicated high-detail portrait renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/assets/generate_wellspring_visual_catalog_v2.py')
          text = path.read_text(encoding='utf-8')
          marker = '''from wellspring_pixel_art_v2 import (
              ATLAS_SIZE, make_animation_keyframe_board, make_character_atlas,
              make_direction_preview, make_portrait, make_selection_icon, rgba, save_png,
          )'''.replace('          ', '')
          replacement = marker + '\nfrom wellspring_portraits_v3 import make_portrait, make_selection_icon'
          if marker in text:
              path.write_text(text.replace(marker, replacement), encoding='utf-8')
          elif 'from wellspring_portraits_v3 import make_portrait, make_selection_icon' not in text:
              raise SystemExit('could not activate dedicated portrait renderer')
          PY

      - name: Compile generators and validators
        run: |
          python -m py_compile \
            tools/assets/generate_visual_assets_v1.py \
            tools/assets/validate_visual_assets_v1.py \
            tools/assets/generate_complete_visual_catalog_v1.py \
            tools/assets/refresh_visual_hashes_v1.py \
            tools/assets/validate_complete_visual_catalog_v1.py \
            tools/assets/wellspring_catalog_data_v2.py \
            tools/assets/wellspring_pixel_art_v2.py \
            tools/assets/wellspring_portraits_v3.py \
            tools/assets/wellspring_environment_v2.py \
            tools/assets/generate_wellspring_visual_catalog_v2.py \
            tools/assets/validate_wellspring_visual_catalog_v2.py \
            tools/assets/validate_visual_quality_v3.py

      - name: Validate committed legacy visual catalog
        run: |
          python tools/assets/validate_visual_assets_v1.py
          python tools/assets/validate_complete_visual_catalog_v1.py

      - name: Generate and validate Wellspring visual catalog
        run: |
          python tools/assets/generate_wellspring_visual_catalog_v2.py
          python tools/assets/validate_wellspring_visual_catalog_v2.py
          python tools/assets/validate_visual_quality_v3.py

      - name: Confirm generated documentation tables
        run: |
          grep -q 'The Wellspring visual-production catalog v2' docs/WELLSPRING-VISUAL-PRODUCTION.md
          grep -q 'WELLSPRING_VISUAL_V2' README.md
          grep -q '## Race and ancestry catalog' docs/WELLSPRING-VISUAL-PRODUCTION.md
          test -s content/visual/wellspring_visual_catalog_v2.json
          test -s content/visual/wellspring_visual_hashes_v2.json

      - name: Commit generated repository assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            docs/WELLSPRING*.md \
            tools/assets/generate_wellspring_visual_catalog_v2.py \
            assets/icons \
            assets/effects \
            assets/maps \
            assets/props_v2 \
            assets/sprites/races_v2 \
            assets/sprites/champions_v2 \
            assets/tiles/wellspring \
            assets/tiles/materials_v2 \
            assets/ui/wellspring_v2 \
            content/maps/wellspring \
            content/maps/wellspring_hub_v2.json \
            content/maps/sanctum_to_wellspring_alias_v2.json \
            content/visual/wellspring_visual_catalog_v2.json \
            content/visual/wellspring_visual_hashes_v2.json
          if git diff --cached --quiet; then
            echo 'Generated Wellspring assets already match the repository.'
            exit 0
          fi
          git commit -m 'feat(assets): regenerate Wellspring visual catalog v2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
